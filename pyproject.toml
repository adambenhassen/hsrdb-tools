[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hsrdb-tools"
dynamic = ["version"]
description = "Build HighScore (.hsrdb) reference databases from Crystallography Open Database CIF files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["gemmi>=0.7", "numpy>=1.24", "spglib>=2.7"]  # spglib.error is new in 2.7
keywords = ["crystallography", "powder diffraction", "CIF", "COD", "HighScore"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hsrdb-tools = "hsrdb_tools.__main__:main"

[tool.setuptools]
packages = ["hsrdb_tools"]

[tool.setuptools.dynamic]
version = {attr = "hsrdb_tools.__version__"}

[tool.setuptools.package-data]
hsrdb_tools = ["*.json", "*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B905",  # zip() without strict=: the lengths match by construction
    "E731",  # small lambdas assigned to names
    "E741",  # l for an index of a reflection hkl
]

[tool.ruff.lint.per-file-ignores]
"dev/**" = ["E401", "E402", "E701", "E702"]  # one-off scripts: compact style
