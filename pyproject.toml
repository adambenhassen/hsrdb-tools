[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hsrdb-tools"
dynamic = ["version"]
description = "Build HighScore (.hsrdb) reference databases from Crystallography Open Database CIF files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["gemmi>=0.7", "numpy>=1.24", "spglib>=2.7"]  # spglib.error is new in 2.7

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hsrdb-tools = "hsrdb_tools.__main__:main"

[tool.setuptools]
packages = ["hsrdb_tools"]

[tool.setuptools.dynamic]
version = {attr = "hsrdb_tools.__version__"}

[tool.setuptools.package-data]
hsrdb_tools = ["*.json", "*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
